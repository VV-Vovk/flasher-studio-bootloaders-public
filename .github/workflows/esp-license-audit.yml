name: ESP Recovery license inventory (no firmware publication)
on:
  push:
    branches: [main]
    paths:
      - 'recovery/**'
      - 'tools/esp_profiles.py'
      - 'tools/audit_esp.py'
      - '.github/workflows/esp-license-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        radio: [wifi, ble, wifi-ble]
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Build exact 4 MiB ESP32-C3 profile and generate license evidence
        env:
          TARGET: esp32c3
          RADIO: ${{ matrix.radio }}
        run: |
          set -eu
          python tools/esp_profiles.py prepare "$TARGET" "$RADIO" 4 4
          docker pull espressif/idf:v5.4.2
          mkdir -p audit
          docker image inspect --format '{{json .RepoDigests}}' espressif/idf:v5.4.2 > audit/container-digests.json
          docker run --rm -v "$PWD:/project" -w /project/recovery -e TARGET -e RADIO espressif/idf:v5.4.2 bash -ec '
            idf.py -DIDF_TARGET="$TARGET" -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.transport" build
            python /project/tools/audit_esp.py
            python -m venv /tmp/fs-sbom
            /tmp/fs-sbom/bin/pip install --disable-pip-version-check esp-idf-sbom==1.3.1
            /tmp/fs-sbom/bin/esp-idf-sbom create --file-tags -o /project/audit/application.spdx build/project_description.json
            test -s /project/audit/application.spdx
          '
          # Only named text audit outputs; no wildcard over build directories.
          sudo chown -R "$(id -u):$(id -g)" audit
      - uses: actions/upload-artifact@v6
        with:
          name: esp32c3-${{ matrix.radio }}-license-evidence
          path: |
            audit/*.json
            audit/application.spdx
          if-no-files-found: error
          retention-days: 7
